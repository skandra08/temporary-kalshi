[project]
name = "quantlab"
version = "0.1.0"
description = "Bias-aware backtesting and strategy-validation framework"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "requests"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools]
packages = ["quantlab", "mmsim", "digitaledge", "digitaledge.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
